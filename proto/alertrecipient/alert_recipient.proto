syntax = "proto3";

package alertrecipient;

option go_package = "github.com/tifacusil/go-user-management/internal/grpc/alertrecipientpb";

service AlertRecipientService {
  // GetRecipients returns all users subscribed to a project at or above the given alert level,
  // filtered by quiet hours (red alerts bypass quiet hours entirely).
  rpc GetRecipients(GetRecipientsRequest) returns (GetRecipientsResponse);
}

message GetRecipientsRequest {
  string project_id  = 1;
  string alert_level = 2; // "blue" | "orange" | "red"
}

message GetRecipientsResponse {
  repeated Recipient recipients = 1;
}

message Recipient {
  int64  user_id    = 1;
  string email      = 2;
  string phone_e164 = 3;
  bool   sms_enabled   = 4;
  bool   push_enabled  = 5;
  bool   email_enabled = 6;
  repeated string device_tokens = 7;
}
